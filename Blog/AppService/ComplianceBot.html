        { ref: 'IMO ↔ IACS Relationship',
          text: 'IMO = the policy framework. IACS UR E26/E27 = technical implementation for newbuildings. Together they form the complete regulatory stack for global ship cyber compliance.' }
      ],
      sources: [
        { label: '🌐 Intl. Association Docs', url: 'https://www.shippauljobs.com/p/international-association-compliance.html' },
        { label: '📥 Class Society Docs', url: 'https://www.shippauljobs.com/p/class-society-cyber-guidelines-iacs-ur.html' }
      ]
    },
  ];

  /* ── 3. Search ───────────────────────────────────────────── */
  function search(query) {
    var q = query.toLowerCase().trim();
    if (!q) return [];
    var scored = KB.map(function (entry) {
      var score = 0;
      entry.keywords.forEach(function (kw) {
        if (q.indexOf(kw.toLowerCase()) !== -1) score += kw.length;
        if (kw.toLowerCase().indexOf(q) !== -1) score += Math.floor(kw.length / 2);
      });
      return { entry: entry, score: score };
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored[0].score > 0 ? [scored[0].entry] : [];
  }

  /* ── 4. Render helpers ───────────────────────────────────── */
  var chat = document.getElementById('cb-chat');

  function addMsg(html, who) {
    var d = document.createElement('div');
    d.className = 'cb-msg ' + (who === 'user' ? 'cb-user' : 'cb-bot');
    d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function renderAnswer(entry) {
    var html = '<strong style="color:#ececec;font-size:11.5px;font-weight:700;">' + entry.title + '</strong>';
    html += '<div style="color:#8e8ea0;font-size:10.5px;margin:4px 0 5px;line-height:1.6;">' + entry.summary + '</div>';
    entry.clauses.forEach(function (c) {
      html += '<div class="cb-clause"><span class="cb-clause-ref">' + c.ref + '</span>' +
              '<span class="cb-clause-text">' + c.text + '</span></div>';
    });
    html += '<div class="cb-sources">';
    entry.sources.forEach(function (src) {
      html += '<a class="cb-src" href="' + src.url + '" target="_blank" rel="noopener">' + src.label + '</a>';
    });
    html += '</div>';
    return html;
  }

  function handleQuery(q) {
    if (!q.trim()) return;
    addMsg(q, 'user');
    document.getElementById('cb-input').value = '';
    var results = search(q);
    if (results.length) {
      addMsg(renderAnswer(results[0]), 'bot');
    } else {
      addMsg(
        'No exact match found.<br>' +
        '<span style="color:#6b6b6b;font-size:10px;">Try: IACS UR E26, BIMCO, IEC 62443, NIS2, USCG, DNV, KR, ABS, IMO</span>',
        'bot'
      );
    }
  }

  /* ── 5. Init & Events ────────────────────────────────────── */
  addMsg(
    'Hello — I\'m <strong style="color:#19c37d;">ShipPaul Compliance AI</strong>.<br>' +
    '<span style="color:#8e8ea0;font-size:10.5px;">' +
    'Ask me about IACS UR E26/E27, BIMCO, NIS2, IEC 62443, USCG, class society rules, and more.</span>',
    'bot'
  );

  /* Chips */
  document.querySelectorAll('.cb-chip').forEach(function (btn) {
    btn.addEventListener('click', function () {
      handleQuery(btn.getAttribute('data-q'));
    });
  });

  /* Send button */
  document.getElementById('cb-send').addEventListener('click', function () {
    handleQuery(document.getElementById('cb-input').value);
  });

  /* Enter key */
  document.getElementById('cb-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleQuery(this.value);
  });

})();
</script>
