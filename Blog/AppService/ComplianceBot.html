  var SITEMAP = { urls: [], loaded: false };

  var SM_TTL = 7 * 24 * 60 * 60 * 1000; /* 7 days */
  var SM_ROOT = 'https://www.shippauljobs.com/sitemap.xml';

  function parseLocs(xml) {
    return (xml.match(/<loc>([^<]+)<\/loc>/g) || [])
      .map(function (l) { return l.replace(/<\/?loc>/g, '').trim(); });
  }

  function smSaveCache(urls) {
    try { localStorage.setItem(SM_CACHE_KEY, JSON.stringify({ ts: Date.now(), urls: urls })); } catch (e) {}
  }

  function smFinish(urls) {
    SITEMAP.urls = urls;
    SITEMAP.loaded = true;
    smSaveCache(urls);
  }

  function smFetchFresh() {
    fetch(SM_ROOT, { cache: 'no-cache' })
      .then(function (r) { return r.text(); })
      .then(function (text) {
        var urls = parseLocs(text);
        if (text.indexOf('<sitemapindex') === -1) { smFinish(urls); return; }

        /* sitemap index — collect sub-sitemap URLs then fetch each */
        var subs = urls.filter(function (u) {
          return u.indexOf('sitemap') !== -1 && u !== SM_ROOT;
        }).slice(0, 6);
        if (!subs.length) { smFinish(urls); return; }

        var pending = subs.length;
        subs.forEach(function (sub) {
          fetch(sub, { cache: 'no-cache' })
            .then(function (r) { return r.text(); })
            .then(function (t) { parseLocs(t).forEach(function (u) { urls.push(u); }); })
            .catch(function () {})
            .then(function () { if (--pending === 0) smFinish(urls); });
        });
      })
      .catch(function () {});
  }

  function loadSitemap() {
    try {
      var raw = localStorage.getItem(SM_CACHE_KEY);
      if (raw) {
        var c = JSON.parse(raw);
        if (c && c.ts && Array.isArray(c.urls) && (Date.now() - c.ts) < SM_TTL && c.urls.length) {
          SITEMAP.urls = c.urls;
          SITEMAP.loaded = true;
          return; /* cache hit — skip fetch */
        }
      }
    } catch (e) {}
    smFetchFresh(); /* cache miss or expired — fetch & update */
  }

  function slugToTitle(url) {
    var slug = url.split('/').pop().replace(/\.html$/, '');
    return slug.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  /* Search sitemap by KB entry keywords */
  function findRelatedPosts(entry) {
    if (!SITEMAP.urls.length) return [];
    var kwList = entry.keywords.slice(0, 6);
    var scored = SITEMAP.urls.map(function (url) {
      var slug = url.toLowerCase();
      var alreadyLinked = entry.sources.some(function (src) { return src.url === url; });
      if (alreadyLinked) return { url: url, score: 0 };
      var score = 0;
      kwList.forEach(function (kw) {
        var kwH = kw.toLowerCase().replace(/\s+/g, '-');
        if (slug.indexOf(kwH) !== -1) score += 3;
        kw.toLowerCase().split(/\s+/).forEach(function (word) {
          if (word.length > 3 && slug.indexOf(word) !== -1) score += 1;
        });
      });
      return { url: url, score: score };
    }).filter(function (item) { return item.score > 1; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.slice(0, 3).map(function (item) { return item.url; });
  }

  /* Search sitemap directly by free-text query (used when no KB match) */
  function findRelatedByQuery(query) {
    if (!SITEMAP.urls.length) return [];
    var words = query.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 2; });
    if (!words.length) return [];
    var scored = SITEMAP.urls.map(function (url) {
      var slug = url.toLowerCase();
      var score = 0;
      words.forEach(function (word) {
        /* Hyphenated slug match */
        if (slug.indexOf(word) !== -1) score += word.length;
        /* Partial prefix match */
        if (word.length > 4 && slug.indexOf(word.slice(0, 4)) !== -1) score += 1;
      });
      return { url: url, score: score };
    }).filter(function (item) { return item.score > 0; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.slice(0, 4).map(function (item) { return item.url; });
  }

  /* ── 5. GPT Call ─────────────────────────────────────────── */
  function callGPT(query, onDone, onError) {
    var hits = search(query);
    var ctx;
    if (hits.length) {
      var e = hits[0];
      ctx = 'Primary reference — ' + e.title + ':\n' +
        e.clauses.map(function (c) {
          return '[' + c.doc + ' | ' + c.ref + ']: ' + c.text;
        }).join('\n');
    } else {
      ctx = 'Topics available: IACS UR E26, E27, IACS Rec-190/194, BIMCO v5, IEC 62443, NIS2, EU CRA, GDPR, NIST SP 800-82, USCG MTSA, Singapore CSA, KISA, DNV, KR, LR, BV, NK, CCS, RINA, CR, ABS, IMO MSC-FAL.1/Circ.3, African Port Cyber';
    }
    var sys = 'You are ShipPaul Compliance AI — maritime cybersecurity compliance expert.\n' +
      'Relevant KB:\n' + ctx + '\n\n' +
      'For each answer point, cite [Document | Article/Section]. Under 320 words. Professional maritime tone.';

    fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + AI_KEY_GPT
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        temperature: 0.25,
        max_tokens: 500,
        messages: [
          { role: 'system', content: sys },
          { role: 'user', content: query }
        ]
      })
    })
    .then(function (r) {
      if (!r.ok) {
        return r.json().then(function (j) {
          throw new Error(j.error ? j.error.message : 'HTTP ' + r.status);
        });
      }
      return r.json();
    })
    .then(function (data) {
      var msg = data.choices && data.choices[0] && data.choices[0].message;
      onDone(msg ? msg.content.trim() : '');
    })
    .catch(function (err) { onError(err.message || 'Request failed'); });
  }

  function renderGPTText(raw) {
    var escaped = raw
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#ececec">$1</strong>');
    escaped = escaped.replace(/\[([^\]]+)\]/g, '<span class="cb-gpt-ref">[$1]</span>');
    escaped = escaped.replace(/(https?:\/\/[^\s<>"']+)/g, function (url) {
      var href = url.replace(/&amp;/g, '&');
      return '<a class="cb-gpt-url" href="' + href + '" target="_blank" rel="noopener">' + url + '</a>';
    });
    escaped = escaped.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
    return escaped;
  }

    var hits = search(query);
    var ctx = hits.length
      ? 'Primary reference — ' + hits[0].title + ':\n' + hits[0].clauses.map(function (c) {
          return '[' + c.doc + ' | ' + c.ref + ']: ' + c.text;
        }).join('\n')
      : 'Topics in KB: IACS UR E26, E27, BIMCO v5, IEC 62443, NIS2, NIST SP 800-82, USCG MTSA, Singapore CSA, KISA, DNV, KR, ABS, IMO MSC-FAL.1/Circ.3';
    var sys = 'You are ShipPaul Compliance AI — maritime cybersecurity compliance expert.\n' +
      'Relevant KB:\n' + ctx + '\n\n' +
      'For each answer point, cite [Document | Article/Section]. Under 320 words. Professional maritime tone.';
    fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: sys },
          { role: 'user', content: query }
        ],
        model: 'openai',
        seed: -1
      })
    })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (text) { onDone(text.trim()); })
    .catch(function (err) { onError(err.message || 'Request failed'); });
  }

  /* ── 6. Search (local KB) ────────────────────────────────── */
  function search(query) {
    var q = query.toLowerCase().trim();
    if (!q) return [];
    var scored = KB.map(function (entry) {
      var score = 0;
      entry.keywords.forEach(function (kw) {
        if (q.indexOf(kw.toLowerCase()) !== -1) score += kw.length;
        if (kw.toLowerCase().indexOf(q) !== -1) score += Math.floor(kw.length / 2);
      });
      return { entry: entry, score: score };
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored[0].score > 0 ? [scored[0].entry] : [];
  }

  /* ── 7. Render ───────────────────────────────────────────── */
  var chat = document.getElementById('cb-chat');

  function addMsg(html, who) {
    var d = document.createElement('div');
    d.className = 'cb-msg ' + (who === 'user' ? 'cb-user' : 'cb-bot');
    d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function renderAnswer(entry) {
    var html = '<strong style="color:#ececec;font-size:11.5px;font-weight:700;">' + entry.title + '</strong>';
    html += '<div style="color:#8e8ea0;font-size:10.5px;margin:4px 0 5px;line-height:1.6;">' + entry.summary + '</div>';
    entry.clauses.forEach(function (c) {
      var docLabel = c.docUrl
        ? '<a class="cb-doc-link" href="' + c.docUrl + '" target="_blank" rel="noopener">' + c.doc + ' ↗</a>'
        : c.doc;
      html += '<div class="cb-clause">' +
              '<span class="cb-clause-doc">' + docLabel + '</span>' +
              '<span class="cb-clause-ref">▸ ' + c.ref + '</span>' +
              '<span class="cb-clause-text">' + c.text + '</span>' +
              '</div>';
    });
    html += '<div class="cb-sources">';
    entry.sources.forEach(function (src) {
      html += '<a class="cb-src" href="' + src.url + '" target="_blank" rel="noopener">' + src.label + '</a>';
    });
    html += '</div>';
    var related = findRelatedPosts(entry);
    if (related.length) {
      html += buildRelatedBlock(related);
    }
    return html;
  }

  function buildRelatedBlock(urls) {
    var block = '<div class="cb-related"><div class="cb-related-title">Related Posts on ShipPaulJobs</div>';
    urls.forEach(function (url) {
      block += '<a class="cb-related-link" href="' + url + '" target="_blank" rel="noopener">&#8594; ' + slugToTitle(url) + '</a>';
    });
    block += '</div>';
    return block;
  }

  function appendSourcesAndRelated(bubble, query) {
    var hits = search(query);
    var extra = '';
    if (hits.length) {
      extra += '<div class="cb-sources">';
      hits[0].sources.forEach(function (src) {
        extra += '<a class="cb-src" href="' + src.url + '" target="_blank" rel="noopener">' + src.label + '</a>';
      });
      extra += '</div>';
      var kbRelated = findRelatedPosts(hits[0]);
      if (kbRelated.length) extra += buildRelatedBlock(kbRelated);
    } else {
      /* No KB match — fall back to direct query-based sitemap search */
      var qRelated = findRelatedByQuery(query);
      if (qRelated.length) extra += buildRelatedBlock(qRelated);
    }
    if (extra) bubble.innerHTML += extra;
  }

  /* ── 8. Handle Query ─────────────────────────────────────── */
  function handleQuery(q) {
    if (!q.trim()) return;
    addMsg(q, 'user');
    document.getElementById('cb-input').value = '';

    if (ACTIVE_AI === 'gpt' || ACTIVE_AI === 'claude') {
      var callFn = ACTIVE_AI === 'gpt' ? callGPT : callClaude;
      var badgeLabel = ACTIVE_AI === 'gpt' ? 'GPT-4o-mini' : 'AI (OpenRouter · Free)';
      var aiName = ACTIVE_AI === 'gpt' ? 'GPT' : 'Claude';
      var bubble = addMsg('<span class="cb-thinking">● Thinking…</span>', 'bot');
      callFn(q, function (text) {
        bubble.innerHTML =
          '<span class="cb-gpt-badge">' + badgeLabel + '</span><br><br>' +
          '<span class="cb-gpt-text">' + renderGPTText(text) + '</span>';
        appendSourcesAndRelated(bubble, q);
        chat.scrollTop = chat.scrollHeight;
      }, function (errMsg) {
        bubble.innerHTML =
          '<span style="color:#e07070;font-size:11px;">⚠ ' + aiName + ' API Error: ' + errMsg + '</span><br>' +
          '<span style="color:#5a5a6e;font-size:10px;">Check your API key — click 🔑 Connect AI to update it. Falling back to local KB.</span>';
        chat.scrollTop = chat.scrollHeight;
        var hits = search(q);
        if (hits.length) setTimeout(function () { addMsg(renderAnswer(hits[0]), 'bot'); }, 200);
      });
    } else {
      /* kb-only mode — KB match → structured response, miss → free AI → commercial AI fallback */
      var hits = search(q);
      if (hits.length) {
        addMsg(renderAnswer(hits[0]), 'bot');
      } else {
        var bubble = addMsg('<span class="cb-thinking">● Thinking…</span>', 'bot');

        /* ── Tier 3: no key → show connect-AI CTA and auto-open panel ── */
        function showConnectAIPrompt(bubble2, qRelated) {
          var html =
            '<div style="color:#8e8ea0;font-size:11px;margin-bottom:10px;">' +
              '내장 KB 및 무료 AI에 해당 주제의 정보가 없습니다.<br>' +
              '<span style="color:#5a5a6e;font-size:10px;">아래에서 AI를 연결하면 모든 해사 사이버 주제에 바로 답변받을 수 있습니다.</span>' +
            '</div>' +
            '<div style="background:rgba(16,163,127,0.08);border:1px solid rgba(16,163,127,0.25);border-radius:8px;padding:11px 13px;margin-bottom:8px;">' +
              '<div style="color:#6fcfb0;font-size:9.5px;font-weight:700;letter-spacing:0.06em;margin-bottom:8px;text-transform:uppercase;">🔑 AI 연결 — 모든 주제 무제한 답변</div>' +
              '<div style="display:flex;flex-direction:column;gap:6px;">' +
                '<button onclick="(function(){' +
                  'var p=document.getElementById(\'cb-ai-panel\');' +
                  'p.style.display=\'block\';' +
                  'cbSwitchTab(\'claude\');' +
                  'p.scrollIntoView({behavior:\'smooth\',block:\'nearest\'});' +
                '})()" style="background:rgba(16,163,127,0.18);border:1px solid rgba(16,163,127,0.5);border-radius:6px;color:#19c37d;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:700;padding:7px 13px;text-align:left;width:100%;">' +
                  '🤖 OpenRouter 연결 (무료 계정 · 카드 불필요) →' +
                '</button>' +
                '<button onclick="(function(){' +
                  'var p=document.getElementById(\'cb-ai-panel\');' +
                  'p.style.display=\'block\';' +
                  'cbSwitchTab(\'gpt\');' +
                  'p.scrollIntoView({behavior:\'smooth\',block:\'nearest\'});' +
                '})()" style="background:rgba(74,222,128,0.07);border:1px solid rgba(74,222,128,0.2);border-radius:6px;color:#6ee7b7;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:700;padding:7px 13px;text-align:left;width:100%;">' +
                  '🟢 ChatGPT 연결 (OpenAI API 키) →' +
                '</button>' +
              '</div>' +
              '<div style="color:#4a4a5a;font-size:9px;margin-top:8px;line-height:1.5;">' +
                'OpenRouter: <a href="https://openrouter.ai/keys" target="_blank" rel="noopener" style="color:#5a5a6a;">openrouter.ai/keys</a> &nbsp;|&nbsp; ' +
                'OpenAI: <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener" style="color:#5a5a6a;">platform.openai.com/api-keys</a>' +
              '</div>' +
            '</div>';
          if (qRelated.length) html += buildRelatedBlock(qRelated);
          bubble2.innerHTML = html;
          /* auto-open the AI panel */
          var panel = document.getElementById('cb-ai-panel');
          if (panel) panel.style.display = 'block';
          chat.scrollTop = chat.scrollHeight;
        }

        /* ── Tier 2: commercial AI fallback (key stored despite kb-only state) ── */
        function tryCommercialFallback(bubble2, q2) {
          var qRelated = findRelatedByQuery(q2);
          if (AI_KEY_CLAUDE) {
            callClaude(q2, function (text) {
              bubble2.innerHTML =
                '<span class="cb-gpt-badge">OpenRouter · Fallback</span><br><br>' +
                '<span class="cb-gpt-text">' + renderGPTText(text) + '</span>';
              appendSourcesAndRelated(bubble2, q2);
              chat.scrollTop = chat.scrollHeight;
            }, function () { showConnectAIPrompt(bubble2, qRelated); });
          } else if (AI_KEY_GPT) {
            callGPT(q2, function (text) {
              bubble2.innerHTML =
                '<span class="cb-gpt-badge">GPT · Fallback</span><br><br>' +
                '<span class="cb-gpt-text">' + renderGPTText(text) + '</span>';
              appendSourcesAndRelated(bubble2, q2);
              chat.scrollTop = chat.scrollHeight;
            }, function () { showConnectAIPrompt(bubble2, qRelated); });
          } else {
            showConnectAIPrompt(bubble2, qRelated);
          }
        }

        /* ── Tier 1: Pollinations free AI ── */
        callFreeAI(q, function (text) {
          bubble.innerHTML =
            '<span class="cb-gpt-badge">AI · Free</span><br><br>' +
            '<span class="cb-gpt-text">' + renderGPTText(text) + '</span>';
          appendSourcesAndRelated(bubble, q);
          chat.scrollTop = chat.scrollHeight;
        }, function () {
          tryCommercialFallback(bubble, q);
        });
      }
    }
  }

  /* ── 9. Init & Events ────────────────────────────────────── */
  /* Clean up any leftover hardcoded keys from previous code versions */
  (function () {
    var stored = localStorage.getItem('cb_claude_key');
    var oldKeys = [
      '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',
      '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'
    ];
    if (oldKeys.indexOf(stored) !== -1) {
      localStorage.removeItem('cb_claude_key');
      AI_KEY_CLAUDE = '';
      ACTIVE_AI = AI_KEY_GPT ? 'gpt' : 'kb-only';
    }
  })();

  loadSitemap();
  refreshAIUI();

  addMsg(
    'Hello — I\'m <strong style="color:#19c37d;">ShipPaul Compliance AI</strong>.<br>' +
    '<span style="color:#8e8ea0;font-size:10.5px;">' +
    'Ask about IACS UR E26/E27/Rec, BIMCO, NIS2, EU CRA, GDPR, IEC 62443, USCG, DNV, LR, BV, NK, CCS, RINA, KR, ABS, IMO, and more.<br>' +
    'Each answer includes <strong style="color:#6fcfb0;">document · clause reference</strong> — click the document name to open the official source.<br>' +
    (ACTIVE_AI !== 'kb-only'
      ? '<span style="color:#19c37d;">✅ AI connected — any maritime cyber question will be answered.</span>'
      : '<span style="color:#5a5a6e;">23 built-in regulations · KB 외 질문은 무료 AI 자동 응답 · AI 키 연결 시 ChatGPT/Claude로 무제한 답변.</span>'
    ) +
    '</span>',
    'bot'
  );

  document.getElementById('cb-ai-toggle').addEventListener('click', function () {
    var panel = document.getElementById('cb-ai-panel');
    var isHidden = panel.style.display === 'none' || panel.style.display === '';
    panel.style.display = isHidden ? 'block' : 'none';
  });

  document.getElementById('cb-claude-save').addEventListener('click', function () {
    var val = document.getElementById('cb-claude-input').value.trim();
    if (!val) { document.getElementById('cb-ai-panel').style.display = 'none'; return; }
    if (val.indexOf('sk-or-v1-') !== 0) {
      document.getElementById('cb-claude-input').style.borderColor = 'rgba(220,80,80,0.7)';
      return;
    }
    var saveBtn = document.getElementById('cb-claude-save');
    saveBtn.textContent = 'Testing…';
    saveBtn.disabled = true;
    fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + val,
        'HTTP-Referer': 'https://www.shippauljobs.com',
        'X-Title': 'ShipPaul Compliance AI'
      },
      body: JSON.stringify({
        model: 'meta-llama/llama-3.1-8b-instruct:free',
        max_tokens: 5,
        messages: [{ role: 'user', content: 'hi' }]
      })
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); })
    .then(function (res) {
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      var hasContent = res.ok && res.data.choices && res.data.choices[0] &&
                       res.data.choices[0].message && res.data.choices[0].message.content;
      if (hasContent) {
        AI_KEY_CLAUDE = val;
        ACTIVE_AI = 'claude';
        localStorage.setItem('cb_claude_key', val);
        document.getElementById('cb-claude-input').value = '';
        document.getElementById('cb-claude-input').style.borderColor = '';
        document.getElementById('cb-ai-panel').style.display = 'none';
        refreshAIUI();
        addMsg('🤖 <strong style="color:#19c37d;">OpenRouter connected.</strong> All questions — including topics outside the built-in KB — will be answered by AI.', 'bot');
      } else {
        var errMsg = (res.data.error && res.data.error.message) || 'No valid response from API';
        document.getElementById('cb-claude-input').style.borderColor = 'rgba(220,80,80,0.7)';
        document.getElementById('cb-claude-input').value = '';
        addMsg('⚠ Key test failed: <span style="color:#e07070;">' + errMsg + '</span><br><span style="color:#5a5a6e;font-size:10px;">Need a valid key → <a style="color:#19c37d;" href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a> (free account available).</span>', 'bot');
      }
    })
    .catch(function () {
      /* Network error — save without validation */
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      AI_KEY_CLAUDE = val;
      ACTIVE_AI = 'claude';
      localStorage.setItem('cb_claude_key', val);
      document.getElementById('cb-claude-input').value = '';
      document.getElementById('cb-ai-panel').style.display = 'none';
      refreshAIUI();
      addMsg('🟣 Key saved (could not verify — network error). Test with a question.', 'bot');
    });
  });

  document.getElementById('cb-claude-clear').addEventListener('click', function () {
    AI_KEY_CLAUDE = '';
    ACTIVE_AI = AI_KEY_GPT ? 'gpt' : 'kb-only';
    localStorage.removeItem('cb_claude_key');
    refreshAIUI();
    addMsg('OpenRouter key removed. KB-only mode.', 'bot');
  });

  document.getElementById('cb-api-save').addEventListener('click', function () {
    var val = document.getElementById('cb-api-input').value.trim();
    if (!val || val.indexOf('sk-') !== 0) {
      document.getElementById('cb-api-input').style.borderColor = 'rgba(220,80,80,0.7)';
      return;
    }
    var saveBtn = document.getElementById('cb-api-save');
    saveBtn.textContent = 'Testing…';
    saveBtn.disabled = true;
    fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + val },
      body: JSON.stringify({ model: 'gpt-4o-mini', max_tokens: 5, messages: [{ role: 'user', content: 'hi' }] })
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); })
    .then(function (res) {
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      var hasContent = res.ok && res.data.choices && res.data.choices[0] &&
                       res.data.choices[0].message && res.data.choices[0].message.content;
      if (hasContent) {
        AI_KEY_GPT = val;
        ACTIVE_AI = 'gpt';
        sessionStorage.setItem('cb_oai_key', val);
        document.getElementById('cb-api-input').value = '';
        document.getElementById('cb-api-input').style.borderColor = '';
        document.getElementById('cb-ai-panel').style.display = 'none';
        refreshAIUI();
        addMsg('🟢 <strong style="color:#19c37d;">GPT-4o-mini connected.</strong> All questions — including topics outside the built-in KB — will be answered by ChatGPT.', 'bot');
      } else {
        var errMsg = (res.data.error && res.data.error.message) || 'No valid response from API';
        document.getElementById('cb-api-input').style.borderColor = 'rgba(220,80,80,0.7)';
        document.getElementById('cb-api-input').value = '';
        addMsg('⚠ Key test failed: <span style="color:#e07070;">' + errMsg + '</span><br><span style="color:#5a5a6e;font-size:10px;">Get a key at <a style="color:#19c37d;" href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com/api-keys</a>.</span>', 'bot');
      }
    })
    .catch(function () {
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      AI_KEY_GPT = val;
      ACTIVE_AI = 'gpt';
      sessionStorage.setItem('cb_oai_key', val);
      document.getElementById('cb-api-input').value = '';
      document.getElementById('cb-ai-panel').style.display = 'none';
      refreshAIUI();
      addMsg('🟢 Key saved (could not verify — network error). Test with a question.', 'bot');
    });
  });

  document.getElementById('cb-api-clear').addEventListener('click', function () {
    AI_KEY_GPT = '';
    ACTIVE_AI = AI_KEY_CLAUDE ? 'claude' : 'kb-only';
    sessionStorage.removeItem('cb_oai_key');
    refreshAIUI();
    addMsg('GPT key removed. Switched to ' + (AI_KEY_CLAUDE ? 'OpenRouter mode.' : 'KB-only mode.'), 'bot');
  });

  document.querySelectorAll('.cb-chip').forEach(function (btn) {
    btn.addEventListener('click', function () { handleQuery(btn.getAttribute('data-q')); });
  });

  document.getElementById('cb-send').addEventListener('click', function () {
    handleQuery(document.getElementById('cb-input').value);
  });

  document.getElementById('cb-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleQuery(this.value);
  });

})();
</script>
