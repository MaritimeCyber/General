        p1: `What is striking is that astronomers never gave up on the three-body problem. Knowing there is no general solution, they still place satellites into precise orbits.`,
        p2: `There is only one method — <b>not a single formula, but ceaseless recalculation.</b> Observe the current position, predict the next short interval numerically, and correct the instant it drifts. Stability does not arrive on its own, so you manufacture it. You find the special points where the three bodies fall briefly into balance — the Lagrange points, say — and seize that narrow window.`,

    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    root.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  }

  function render(lang) {
    var t = CONTENT[lang];
    root.setAttribute('lang', HTML_LANG[lang]);
    document.getElementById('tagPro').textContent = t.tagPro;
    document.getElementById('title').textContent = t.title;
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('sub').textContent = t.sub;
    document.getElementById('scrollCue').textContent = t.scroll;
    document.getElementById('legOwner').textContent = t.legend.owner;
    document.getElementById('legKlass').textContent = t.legend.klass;
    document.getElementById('legYard').textContent = t.legend.yard;
    articleEl.innerHTML = buildArticle(t);
    document.querySelectorAll('#langSwitch button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    setupReveal();
  }

  // build language buttons
  var ls = document.getElementById('langSwitch');
  LANGS.forEach(function (l) {
    var b = document.createElement('button');
    b.textContent = l.label;
    b.setAttribute('data-lang', l.id);
    b.addEventListener('click', function () { render(l.id); });
    ls.appendChild(b);
  });

  render('ko');

  // ---------- Three-body simulation ----------
  (function () {
    var canvas = document.getElementById('sim');
    var ctx = canvas.getContext('2d');
    var width = 0, height = 0;

    function resize() {
      var rect = canvas.getBoundingClientRect();
      width = rect.width || window.innerWidth;
      height = rect.height || window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    var bodies = [
      { label: 'OWNER', color: '#34d399', radius: 9, angle: 0, speed: 0.0030, orbitF: 0.20, trail: [] },
      { label: 'CLASS', color: '#60a5fa', radius: 10, angle: 2, speed: 0.0023, orbitF: 0.27, trail: [] },
      { label: 'SHIPYARD', color: '#f59e0b', radius: 11, angle: 4, speed: 0.0027, orbitF: 0.17, trail: [] },
    ];

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (var x = 0; x < width; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
      for (var y = 0; y < height; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
    }

    function animate() {
      ctx.fillStyle = '#05070b';
      ctx.fillRect(0, 0, width, height);
      drawGrid();

      var cx = width / 2, cy = height / 2;
      var minDim = Math.min(width, height);

      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 26; ctx.shadowColor = '#ffffff';
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(228,231,238,0.55)';
      ctx.font = "11px 'JetBrains Mono', monospace";
      ctx.fillText('UR E26', cx + 12, cy - 10);

      bodies.forEach(function (body, index) {
        body.angle += body.speed;
        var orbit = minDim * body.orbitF + Math.sin(Date.now() * 0.001 + index) * minDim * 0.045;
        var x = cx + Math.cos(body.angle) * orbit;
        var y = cy + Math.sin(body.angle * 1.2) * orbit;

        body.trail.push({ x: x, y: y });
        if (body.trail.length > 170) body.trail.shift();

        ctx.beginPath();
        body.trail.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
        ctx.strokeStyle = body.color; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.22; ctx.stroke(); ctx.globalAlpha = 1;

        ctx.beginPath();
        ctx.arc(x, y, body.radius, 0, Math.PI * 2);
        ctx.fillStyle = body.color; ctx.shadowBlur = 22; ctx.shadowColor = body.color; ctx.fill(); ctx.shadowBlur = 0;

        ctx.fillStyle = '#c8ccd4';
        ctx.font = "11px 'JetBrains Mono', monospace";
        ctx.fillText(body.label, x + 16, y - 14);
      });

      requestAnimationFrame(animate);
    }
    animate();
  })();
})();
</script>
</body>
