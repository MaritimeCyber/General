     Hello Guest Widget — www.shippauljobs.com
     기능: 방문자 IP · 국가 · 지역 · 도시 · 단말기 자동 감지
          감지된 국가에 맞는 언어로 환영 인사 출력
     사용: Blogger → 레이아웃 → HTML/자바스크립트 가젯에 붙여넣기
════════════════════════════════════════════════════════════ -->
<div id="Hello_GuestInfo.html"></div>

<script>
  (function () {
    var GITHUB_RAW_URL =
      "https://raw.githubusercontent.com/MaritimeCyber/General/refs/heads/main/Blog/Backend/Hello_GuestInfo.html";

    var target = document.getElementById("Hello_GuestInfo.html");

    /* ── 날씨 위젯과 동일한 스타일 오버라이드 (우측 패널 전용) ── */
    var styleEl = document.createElement("style");
    styleEl.textContent = [
      /* 컨테이너 — 배경·테두리 제거, 투명하게, 높이 자동 (부모 #hg-right 가 담당) */
      "#hg-right #hg-wrap{background:transparent!important;border:none!important;",
        "box-shadow:none!important;border-radius:0!important;width:100%!important;",
        "max-width:100%!important;height:auto!important;max-height:none!important;",
        "margin:0!important;padding:10px 14px!important;overflow:visible!important;",
        "font-family:monospace!important;font-size:12px!important;",
        "color:#c8e4f8!important;line-height:1.7!important;}",
      "#hg-right #hg-main{height:auto!important;max-height:none!important;overflow:visible!important;}",

      /* 인사말 */
      "#hg-right #hg-greeting{font-size:15px!important;font-weight:700!important;",
        "color:#1affda!important;text-shadow:0 0 8px rgba(26,255,218,0.55)!important;",
        "letter-spacing:0.03em!important;}",

      /* 국기 */
      "#hg-right #hg-flag{font-size:22px!important;}",

      /* 언어 레이블 */
      "#hg-right #hg-lang{font-size:10.5px!important;",
        "color:rgba(200,228,248,0.62)!important;margin-bottom:8px!important;}",

      /* 구분선 */
      "#hg-right #hg-wrap hr,#hg-right #hg-wrap .hg-divider{",
        "border-color:rgba(26,158,130,0.3)!important;}",

      /* 본문 문장 */
      "#hg-right #hg-body{font-size:11.5px!important;color:#c8e4f8!important;",
        "line-height:1.65!important;}",

      /* 추가 확인 정보 */
      "#hg-right #hg-extra{font-size:11px!important;",
        "color:rgba(200,228,248,0.78)!important;",
        "border-top:1px solid rgba(26,158,130,0.28)!important;",
        "margin-top:8px!important;padding-top:8px!important;}",

      /* 안전 확인 문구 */
      "#hg-right #hg-confirm{font-size:12.5px!important;font-weight:700!important;",
        "color:#1affda!important;",
        "text-shadow:0 0 10px rgba(26,255,218,0.7),0 0 22px rgba(26,255,218,0.35)!important;",
        "letter-spacing:0.02em!important;",
        "border-top:1px solid rgba(26,158,130,0.35)!important;",
        "margin-top:6px!important;padding-top:6px!important;}",

      /* 링크 */
      "#hg-right a{color:#1affda!important;text-decoration:none!important;}",
      "#hg-right a:hover{text-shadow:0 0 6px rgba(26,255,218,0.5)!important;}",

      /* 로딩 스피너 */
      "#hg-right #hg-loading{color:rgba(200,228,248,0.45)!important;}",

      /* OSI 레이어 테이블 등 pill 요소 */
      "#hg-right .hg-pill,#hg-right .hg-badge{",
        "background:rgba(26,158,130,0.18)!important;",
        "border:1px solid rgba(26,158,130,0.4)!important;",
        "color:#1affda!important;border-radius:4px!important;}",
    ].join("");
    document.head.appendChild(styleEl);

    fetch(GITHUB_RAW_URL)
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (html) {
        target.innerHTML = html;

        /* innerHTML 삽입된 <script> 강제 실행 */
        var scripts = target.querySelectorAll("script");
        scripts.forEach(function (oldScript) {
          var newScript = document.createElement("script");
          Array.prototype.forEach.call(oldScript.attributes, function (attr) {
            newScript.setAttribute(attr.name, attr.value);
          });
          newScript.textContent = oldScript.textContent;
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      })
      .catch(function (err) {
        console.warn("[gh-inject] Failed to load:", err);
      });
  })();
</script>
