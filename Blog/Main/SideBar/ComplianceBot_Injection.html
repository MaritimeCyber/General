<!-- ════════════════════════════════════════════════════════════
     ComplianceBot Widget Injector — www.shippauljobs.com
     기능: Blog/AppService/ComplianceBot.html 을 GitHub에서
          fetch하여 사이드바 위젯으로 렌더링
     사용: Blogger → 레이아웃 → HTML/자바스크립트 가젯에 붙여넣기
════════════════════════════════════════════════════════════ -->

<div id="cb-wrap" style="background:linear-gradient(135deg,#0a2342,#154f7a);border-radius:12px;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;">

  <!-- Loading state -->
  <div id="cb-loading" style="align-items:center;display:flex;gap:8px;padding:14px 16px;">
    <span id="cb-dot" style="background:#1a9e82;border-radius:50%;flex-shrink:0;height:8px;width:8px;"></span>
    <span style="color:rgba(184,212,234,0.7);font-size:11px;">Loading Compliance Bot…</span>
  </div>

  <!-- Injected content target -->
  <div id="cb-content"></div>

</div>

<script>
(function () {
  var GITHUB_RAW_URL =
    'https://raw.githubusercontent.com/MaritimeCyber/General/refs/heads/main/Blog/AppService/ComplianceBot.html';

  var wrap      = document.getElementById('cb-wrap');
  var loadingEl = document.getElementById('cb-loading');
  var dotEl     = document.getElementById('cb-dot');
  var target    = document.getElementById('cb-content');

  /* ── Pulse animation for loading dot (same pattern as Hello widget) ── */
  var styleEl = document.createElement('style');
  styleEl.textContent = '@keyframes cb-pulse{0%,100%{opacity:.3}50%{opacity:1}}' +
    '#cb-dot{animation:cb-pulse 1.2s ease-in-out infinite;}';
  document.head.appendChild(styleEl);

  fetch(GITHUB_RAW_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (html) {
      /* Hide loading state */
      if (loadingEl) loadingEl.style.display = 'none';

      /* Inject HTML */
      target.innerHTML = html;

      /* innerHTML 삽입된 <script>는 브라우저가 자동 실행하지 않으므로
         새 <script> 엘리먼트로 교체하여 강제 실행 (InjectionCode_Hello 패턴) */
      target.querySelectorAll('script').forEach(function (oldScript) {
        var newScript = document.createElement('script');
        Array.prototype.forEach.call(oldScript.attributes, function (attr) {
          newScript.setAttribute(attr.name, attr.value);
        });
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    })
    .catch(function (err) {
      /* Error fallback — same dark card style */
      if (loadingEl) loadingEl.style.display = 'none';
      target.innerHTML =
        '<div style="padding:12px 16px 14px;">' +
          '<p style="color:rgba(184,212,234,0.55);font-size:11px;line-height:1.6;margin:0 0 10px;">' +
            'Compliance Bot is temporarily unavailable.' +
          '</p>' +
          '<a href="https://www.shippauljobs.com/p/class-society-cyber-guidelines-iacs-ur.html"' +
             ' style="align-items:center;background:rgba(26,158,130,0.25);border:1.5px solid #1a9e82;' +
             'border-radius:8px;color:#7effd8;display:flex;font-size:12px;font-weight:700;' +
             'gap:8px;justify-content:center;padding:9px 14px;text-decoration:none;">' +
            '&#128194; View Compliance Docs &#8594;' +
          '</a>' +
        '</div>';
      console.warn('[gh-inject] ComplianceBot:', err);
    });
})();
</script>
