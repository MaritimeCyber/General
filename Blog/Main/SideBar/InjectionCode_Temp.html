<!-- ═══════════════════════════════════════════════════════
     GitHub Raw Content Injector
     Usage : Paste this into a Blogger HTML widget.
             Change GITHUB_RAW_URL to any raw GitHub file URL.
═══════════════════════════════════════════════════════ -->

<div id="Maritime-Cyber-Intelligence"></div>

<script>
(function () {
  var GITHUB_RAW_URL =
    'https://raw.githubusercontent.com/MaritimeCyber/General/refs/heads/main/Blog/Main/SideBar/Maritime%20Cyber%20%E2%80%8B%E2%80%8BIntelligence.html';

  var target = document.getElementById('Maritime-Cyber-Intelligence');

  fetch(GITHUB_RAW_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (html) {
      target.innerHTML = html;
      /* Re-execute injected <script> tags (browsers block innerHTML scripts) */
      target.querySelectorAll('script').forEach(function (orig) {
        var s = document.createElement('script');
        if (orig.src) {
          s.src = orig.src;
        } else {
          s.textContent = orig.textContent;
        }
        orig.parentNode.replaceChild(s, orig);
      });
    })
    .catch(function (err) {
      console.warn('[gh-inject] Failed to load:', err);
    });
})();
</script>
