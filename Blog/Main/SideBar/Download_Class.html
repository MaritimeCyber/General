<!-- ════════════════════════════════════════════════════════════
     Class Society Cyber Guidelines — Download Widget
     Accordion per classification society → PDF download links
     GitHub raw URL: MaritimeCyber/General / Download/01.Compliance/01.Class/
════════════════════════════════════════════════════════════ -->

<style>
  #dc-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  #dc-wrap {
    font-family: Inter, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ── Widget header ── */
  .dc-hdr {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-bottom: 8px;
    margin-bottom: 4px;
    border-bottom: 2px solid #0a2342;
  }
  .dc-hdr-title {
    font-size: 11px;
    font-weight: 800;
    color: #0a2342;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex: 1;
  }
  .dc-total {
    background: #0a2342;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
  }

  /* ── Society card ── */
  .dc-soc {
    border: 1px solid #d0dde8;
    border-radius: 7px;
    overflow: hidden;
  }

  /* ── Society toggle button ── */
  .dc-soc-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 6px 9px;
    background: #0a2342;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .dc-soc-btn:hover { background: #154f7a; }
  .dc-soc.open .dc-soc-btn { background: #154f7a; }

  .dc-badge {
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 3px;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 2px 5px;
    min-width: 32px;
    text-align: center;
  }
  .dc-flag { font-size: 13px; flex-shrink: 0; line-height: 1; }
  .dc-soc-name {
    flex: 1;
    font-size: 10.5px;
    font-weight: 600;
    color: #c8e4f8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dc-fc {
    flex-shrink: 0;
    font-size: 9px;
    color: rgba(200, 228, 248, 0.55);
    font-weight: 600;
  }
  .dc-arr {
    flex-shrink: 0;
    color: #1a9e82;
    font-size: 8px;
    transition: transform 0.2s;
    line-height: 1;
  }
  .dc-soc.open .dc-arr { transform: rotate(90deg); }

  /* ── File list ── */
  .dc-files { display: none; background: #f8fafc; }
  .dc-soc.open .dc-files { display: block; }

  /* ── File row ── */
  .dc-file {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    text-decoration: none;
    border-bottom: 1px solid #eef2f7;
    transition: background 0.12s;
  }
  .dc-file:last-child { border-bottom: none; }
  .dc-file:hover { background: #e4f0fb; }

  .dc-pdf { flex-shrink: 0; font-size: 12px; line-height: 1; }
  .dc-fname {
    flex: 1;
    font-size: 10.5px;
    color: #2c4a6b;
    font-weight: 500;
    line-height: 1.4;
  }
  .dc-dl {
    flex-shrink: 0;
    color: #1d89cf;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }
</style>

<div id="dc-wrap">
  <div class="dc-hdr">
    <span class="dc-hdr-title">📥 Class Cyber Guidelines</span>
    <span class="dc-total" id="dc-total"></span>
  </div>
  <div id="dc-list"></div>
</div>

<script>
  (function () {
    var BASE =
      "https://github.com/MaritimeCyber/General/raw/refs/heads/main/Download/01.Compliance/01.Class/";

    var SOCIETIES = [
      {
        id: "ABS",
        flag: "🇺🇸",
        name: "American Bureau of Shipping",
        files: [
          {
            label: "CyberSafety Guide v2 (Jun 2025)",
            file: "251-cybersafety-v2-cybersecurity-guide-jun25.pdf",
          },
          {
            label: "Cyber Resilience Guidance",
            file: "ABS_cyber-resilience-guidance.pdf",
          },
          {
            label: "Cyber Safety Vol.7 — Equip. Manufacturers",
            file: "GuideforABSCyberSafetyforEquipmentManufacturers-ABSCyberSafetyVolume7-v2.pdf",
          },
          {
            label: "MVR Part 4 §4-9-13/14 (Jan 2026)",
            file: "mvr-part-4-jan26_4-9-13 14만.pdf",
          },
        ],
      },
      {
        id: "BV",
        flag: "🇫🇷",
        name: "Bureau Veritas",
        files: [
          { label: "NR 659 (Jul 2024)", file: "659-NR_2024-07.pdf" },
          {
            label: "Software Security Brochure",
            file: "BV_Software_Brochure.pdf",
          },
        ],
      },
      {
        id: "CCS",
        flag: "🇨🇳",
        name: "China Classification Society",
        files: [
          {
            label: "Ship Cyber Security Guidelines (2024)",
            file: "Guidelines for Ship Cyber Security (2024).pdf",
          },
        ],
      },
      {
        id: "CR",
        flag: "🇭🇷",
        name: "Croatian Register of Shipping",
        files: [
          {
            label: "Cyber Security Onboard Ships (2025)",
            file: "Guidelines for Cyber Security Onboard Ships 2025.pdf",
          },
        ],
      },
      {
        id: "DNV",
        flag: "🇳🇴",
        name: "Det Norske Veritas",
        files: [
          {
            label: "DNV-RU-SHIP Pt.6 Ch.5 §21 Cyber Security",
            file: "1. (규칙서) DNV-RU-SHIP Pt.6 Ch.5. section 21. Cyber Security pdf 1.pdf",
          },
          {
            label: "Cyber Security & IACS UR — CMC/TA (Apr 2024)",
            file: "2024-04 - DNV Cyber security and IACS UR - Korea CMC product certificate and Type approval.pdf",
          },
        ],
      },
      {
        id: "KR",
        flag: "🇰🇷",
        name: "Korean Register",
        files: [
          {
            label: "Cyber Resilience Guide — Ship Automation (EN)",
            file: "Cyber Resilience Approval and Survey Guide for Ship Automation Systems_Rev0.0(0).pdf",
          },
          {
            label: "Cyber Resilience Guide — Ship Automation (KR)",
            file: "선박 자동화 시스템의 사이버복원력 승인 및 검사 가이드_Rev0.0(0).pdf",
          },
        ],
      },
      {
        id: "LR",
        flag: "🇬🇧",
        name: "Lloyd's Register",
        files: [
          {
            label: "LR-RU-001 Classification Rules (Jul 2025)",
            file: "1. (전문) Regs4ships - LR-RU-001 Rules and Regulations for the Classification of Ships, July 2025.pdf",
          },
        ],
      },
      {
        id: "NK",
        flag: "🇯🇵",
        name: "Nippon Kaiji Kyokai",
        files: [
          {
            label: "T1348e Cyber Security Guidelines",
            file: "Attachment 1- T1348e.pdf",
          },
          {
            label: "UR E22 Rev.3 (Jun 2023)",
            file: "ur_e22_rev.3_june_2023_ul.pdf",
          },
        ],
      },
      {
        id: "RINA",
        flag: "🇮🇹",
        name: "Registro Italiano Navale",
        files: [
          {
            label: "Rules for Ships Part F (2026)",
            file: "REP6 Rules for Ships - Part F 1.1.2026.pdf",
          },
        ],
      },
    ];

    var list = document.getElementById("dc-list");
    var totalEl = document.getElementById("dc-total");
    if (!list) return;

    var total = SOCIETIES.reduce(function (s, soc) {
      return s + soc.files.length;
    }, 0);
    totalEl.textContent = total + " files";

    SOCIETIES.forEach(function (soc) {
      /* ── Society card ── */
      var card = document.createElement("div");
      card.className = "dc-soc";

      /* toggle button */
      var btn = document.createElement("button");
      btn.className = "dc-soc-btn";
      btn.innerHTML =
        '<span class="dc-badge">' +
        soc.id +
        "</span>" +
        '<span class="dc-flag">' +
        soc.flag +
        "</span>" +
        '<span class="dc-soc-name">' +
        soc.name +
        "</span>" +
        '<span class="dc-fc">' +
        soc.files.length +
        "</span>" +
        '<span class="dc-arr">&#9658;</span>';
      btn.addEventListener("click", function () {
        card.classList.toggle("open");
      });

      /* file list */
      var files = document.createElement("div");
      files.className = "dc-files";

      soc.files.forEach(function (f) {
        var url = BASE + soc.id + "/" + encodeURIComponent(f.file);
        var a = document.createElement("a");
        a.className = "dc-file";
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML =
          '<span class="dc-pdf">&#128196;</span>' +
          '<span class="dc-fname">' +
          f.label +
          "</span>" +
          '<span class="dc-dl">&#8595;</span>';
        files.appendChild(a);
      });

      card.appendChild(btn);
      card.appendChild(files);
      list.appendChild(card);
    });
  })();
</script>
