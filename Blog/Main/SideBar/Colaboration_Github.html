<div id="Find-Us-on-GitHub">
  <script>
    (function () {
      var GITHUB_RAW_URL =
        "https://raw.githubusercontent.com/MaritimeCyber/General/refs/heads/main/Blog/Main/SideBar/Find%20Us%20on%20GitHub.html";
      var target = document.getElementById("Find-Us-on-GitHub");
      fetch(GITHUB_RAW_URL)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (html) {
          target.innerHTML = html;
        })
        .catch(function (err) {
          console.warn("[gh-inject] Failed to load:", err);
        });
    })();
  </script>
</div>
