<!--════════════════════════════════════════════════════════════
  Widget : Right-side corporate banner column — 3 slots
           ① 300 × 250   ② 300 × 500   ③ 300 × 500
  Where  : Blogger Layout → 아무 영역 → Add a Gadget → HTML/JavaScript (title empty)
           ※ 어느 영역에 추가해도 화면 오른쪽 빈 공간에 표시됩니다.

  동작
   - 본문 영역의 오른쪽 끝을 측정해, 그 오른쪽 빈 공간에 세로 광고 열을 둡니다.
     본문 첫 위젯과 같은 높이에서 시작하고, 본문과 함께 스크롤됩니다.
     열 폭은 빈 공간에 맞춰 180~252px 사이로 자동 조정(비율 유지).
   - 오른쪽 빈 공간이 부족한 화면(좁은 창·태블릿·모바일)에서는
     첫 번째 본문 위젯 아래에 inlineSlots 개수만큼만 표시합니다(기본 1개 = 300×250).
   - showOn: 표시할 페이지 종류 — "home"(홈), "post"(포스트 상세), "page"(정적 페이지 /p/...),
             "list"(라벨·검색·아카이브 목록). 기본값: 홈 + 포스트 상세.

  설정 : 각 슬롯의 sponsors 에 배너를 넣으면 배너가 표시되고,
         비워두면 해당 크기의 "Advertise here" 광고 자리(판매 중)가 표시됩니다.
         배너 이미지는 슬롯 크기 비율(300×250 / 300×500)로 받으세요.
════════════════════════════════════════════════════════════-->
<style>
  #spj-right-banner { display: none; width: 252px; font-family: "Segoe UI", Arial, sans-serif; box-sizing: border-box; }
  #spj-right-banner.spj-rb-rail { display: block; position: absolute; z-index: 50; }
  #spj-right-banner.spj-rb-inline { display: block; width: auto; max-width: 300px; margin: 0 auto 16px; }
  #spj-right-banner.spj-rb-inline .spj-rb-card.spj-rb-rail-only { display: none; }

  #spj-right-banner .spj-rb-card {
    background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(4,12,28,.25);
    padding: 8px 10px 10px; margin-bottom: 14px;
  }
  #spj-right-banner .spj-rb-card:last-child { margin-bottom: 0; }
  #spj-right-banner .spj-rb-label {
    display: block; font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a9bb0; margin: 0 0 7px;
  }
  #spj-right-banner a { text-decoration: none; }

  /* 등록된 기업 배너 */
  #spj-right-banner .spj-rb-banner { display: block; }
  #spj-right-banner .spj-rb-banner img { display: block; width: 100%; height: auto; border-radius: 6px; }
  #spj-right-banner .spj-rb-name { display: block; margin-top: 6px; font-size: 11px; color: #4a6080; text-align: center; }

  /* 광고 자리 (판매 중) */
  #spj-right-banner .spj-rb-slot {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px; box-sizing: border-box;
    border: 2px dashed #9fb3c8; border-radius: 8px; text-align: center;
    background: repeating-linear-gradient(135deg, #f6f9fc 0 12px, #eef3f8 12px 24px);
  }
  #spj-right-banner .spj-rb-slot:hover { border-color: #1a9e82; }
  #spj-right-banner .spj-rb-size {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; color: #8a9bb0;
    border: 1px solid #c9d6e3; border-radius: 4px; padding: 2px 7px; background: #fff;
  }
  #spj-right-banner .spj-rb-title { font-size: 16px; font-weight: 800; color: #0a2342; line-height: 1.25; }
  #spj-right-banner .spj-rb-text { font-size: 11px; line-height: 1.55; color: #4a6080; }
  #spj-right-banner .spj-rb-cta {
    margin-top: 4px; padding: 6px 13px; border-radius: 6px;
    background: #0a2342; color: #7effd8; font-size: 11.5px; font-weight: 700;
  }
  #spj-right-banner .spj-rb-slot:hover .spj-rb-cta { background: #154f7a; }
  #spj-right-banner .spj-rb-alt { display: block; margin-top: 7px; font-size: 10px; color: #8a9bb0; text-align: center; }
  #spj-right-banner .spj-rb-alt a { color: #154f7a; text-decoration: underline; }
</style>

<div id="spj-right-banner"></div>

<script>
(function () {
  var SPJ_RIGHT_BANNER = {
    slots: [
      { size: "300 \u00d7 250", ratio: "6 / 5", sponsors: [
        // { name: "Company Name", image: "https://.../banner-300x250.png",
        //   url: "https://www.company.com/?utm_source=shippauljobs&utm_medium=right_300x250",
        //   alt: "Company Name — maritime cyber security solutions" }
      ] },
      { size: "300 \u00d7 500", ratio: "3 / 5", sponsors: [
        // { name: "...", image: "https://.../banner-300x500.png", url: "https://...", alt: "..." }
      ] },
      { size: "300 \u00d7 500", ratio: "3 / 5", sponsors: [
        // { name: "...", image: "https://.../banner-300x500.png", url: "https://...", alt: "..." }
      ] }
    ],
    inlineSlots: 1,          // 좁은 화면에서 본문에 보여줄 슬롯 개수 (위에서부터)
    showOn: ["home", "post"],
    advertiseUrl: "https://www.shippauljobs.com/p/advertisement-policy.html",
    contactUrl: "https://www.shippauljobs.com/p/contact-shippauljobs.html"
  };

  var MAX_W = 252, MIN_W = 180, GAP = 12;
  var box = document.getElementById("spj-right-banner");
  if (!box) return;
  // ── 현재 페이지 종류 판별 ──
  function pageType() {
    var path = location.pathname;
    if (document.body.classList.contains("is-homepage") || path === "/" || path === "/index.html") return "home";
    if (/^\/\d{4}\/\d{2}\/[^\/]+\.html$/.test(path)) return "post";
    if (/^\/p\/[^\/]+\.html$/.test(path)) return "page";
    return "list";
  }
  if (SPJ_RIGHT_BANNER.showOn.indexOf(pageType()) === -1) return;

  // Blogger 가 가젯 저장 시 ×, · 같은 문자를 &#215; 형태로 바꿔 저장하므로, 먼저 원래 문자로 되돌린 뒤 이스케이프
  function decode(t) {
    return String(t || "")
      .replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(+n); })
      .replace(/&#x([0-9a-f]+);/gi, function (_, h) { return String.fromCharCode(parseInt(h, 16)); })
      .replace(/&nbsp;/g, "\u00a0").replace(/&middot;/g, "\u00b7").replace(/&times;/g, "\u00d7").replace(/&amp;/g, "&");
  }
  function esc(t) { return decode(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ── 슬롯 만들기 ──
  var html = "";
  SPJ_RIGHT_BANNER.slots.forEach(function (slot, i) {
    var list = (slot.sponsors || []).filter(function (x) { return x && x.image && x.url; });
    var railOnly = i >= SPJ_RIGHT_BANNER.inlineSlots ? " spj-rb-rail-only" : "";
    if (list.length) {
      var sp = list[Math.floor(Math.random() * list.length)];
      html +=
        '<div class="spj-rb-card' + railOnly + '"><span class="spj-rb-label">Sponsored</span>' +
          '<a class="spj-rb-banner" href="' + esc(sp.url) + '" target="_blank" rel="sponsored noopener">' +
            '<img src="' + esc(sp.image) + '" alt="' + esc(sp.alt || sp.name) + '" loading="lazy" style="aspect-ratio:' + esc(slot.ratio) + ';object-fit:cover">' +
            (sp.name ? '<span class="spj-rb-name">' + esc(sp.name) + "</span>" : "") +
          "</a></div>";
    } else {
      html +=
        '<div class="spj-rb-card' + railOnly + '"><span class="spj-rb-label">Advertise here</span>' +
          '<a class="spj-rb-slot" style="aspect-ratio:' + esc(slot.ratio) + '" href="' + esc(SPJ_RIGHT_BANNER.advertiseUrl) + '" target="_blank" rel="noopener">' +
            '<span class="spj-rb-size">' + esc(slot.size) + " \u00b7 RIGHT</span>" +
            '<span class="spj-rb-title">Your banner here</span>' +
            '<span class="spj-rb-text">Reach maritime engineers, OT/cyber specialists and decision-makers at shipowners, shipyards and makers.</span>' +
            '<span class="spj-rb-cta">See ad options</span>' +
          "</a>" +
          '<span class="spj-rb-alt">or <a href="' + esc(SPJ_RIGHT_BANNER.contactUrl) + '" target="_blank" rel="noopener">contact us</a> for a media kit</span>' +
        "</div>";
    }
  });
  box.innerHTML = html;

  // ── 본문 영역 측정 (보이는 본문 위젯·글 카드 중 가장 오른쪽 끝, 가장 위쪽 시작) ──
  function contentEdges() {
    var els = document.querySelectorAll("#page_body .widget, .post-outer-container, .widget.Blog, .widget.PopularPosts, .widget.FeaturedPost");
    var right = null, top = null;
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el === box || box.contains(el) || el.contains(box)) continue;
      if (getComputedStyle(el).position === "fixed") continue;
      var r = el.getBoundingClientRect();
      if (r.width < 200 || r.height < 30) continue;
      if (right === null || r.right > right) right = r.right;
      if (top === null || r.top < top) top = r.top;
    }
    return right === null ? null : { right: right, top: top + window.scrollY };
  }
  // 좁은 화면: 첫 번째 본문 위젯 "다음"에 넣는다 (카드 그리드 안으로 끼어들지 않도록)
  function inlineAnchor() {
    var ws = document.querySelectorAll("#page_body > .widget, #page_body .widget.Blog");
    for (var i = 0; i < ws.length; i++) {
      if (ws[i] === box || ws[i].contains(box)) continue;
      if (ws[i].getBoundingClientRect().height > 30) return ws[i];
    }
    return null;
  }

  var home = box.parentNode, homeNext = box.nextSibling;
  function place() {
    var edge = contentEdges();
    var vw = document.documentElement.clientWidth;          // 세로 스크롤바 제외 폭
    var free = edge === null ? 0 : vw - edge.right;
    var w = Math.min(MAX_W, free - GAP * 2);
    if (w >= MIN_W) {
      // 오른쪽 빈 공간: 본문 첫 위젯과 같은 높이에서 시작, 본문과 함께 스크롤
      if (box.parentNode !== document.body) document.body.appendChild(box);
      box.className = "spj-rb-rail";
      box.style.width = w + "px";
      box.style.left = Math.round(edge.right + window.scrollX + (free - w) / 2) + "px";
      box.style.top = Math.round(edge.top) + "px";
    } else {
      // 공간 부족 → 첫 본문 위젯 아래 (inlineSlots 개수만 표시)
      var a = inlineAnchor();
      box.className = "spj-rb-inline";
      box.style.left = box.style.top = box.style.width = "";
      if (a && a.parentNode) { if (a.nextSibling !== box) a.parentNode.insertBefore(box, a.nextSibling); }
      else if (box.parentNode !== home) home.insertBefore(box, homeNext);
    }
  }
  place();
  window.addEventListener("load", place);
  window.addEventListener("resize", place);
})();
</script>
