<!--════════════════════════════════════════════════════════════
  Widget : Sidebar — AdSense frame + Corporate banner (Home only)
  Where  : Blogger Layout → Sidebar (Top) → Add a Gadget → HTML/JavaScript
           (title empty)
  Shows  : Only on the home page (template adds body.is-homepage)

  설정 (아래 SPJ_SIDEBAR_ADS 의 값만 바꾸면 됩니다)
   1) adSlot   : AdSense → 광고 → 광고 단위 기준 → 디스플레이 광고 생성 후
                 data-ad-slot 숫자. 비워두면 광고 영역은 표시되지 않습니다.
   2) sponsors : 기업 배너 목록. 여러 개면 방문마다 하나씩 무작위로 표시.
                 비워두면 300×250 "Advertise Here" 광고 자리(판매 중)가 표시되고
                 광고 상품 페이지(/p/advertisement-policy.html)로 연결됩니다.
   3) homeOnly : true = 홈에서만 표시, false = 모든 페이지 사이드바에 표시

  AdSense 정책 메모
   - 광고 라벨은 "Advertisement" / "Sponsored Links" 만 허용 → "Advertisement" 사용
   - 테두리는 허용되지만, 클릭을 유도하는 문구·화살표·이미지는 금지
   - 광고가 채워지지 않으면(unfilled) 테두리 박스 전체를 숨김 → 빈 광고 칸 노출 방지
   - 기업 배너는 광고 단위와 간격을 두고 "Sponsored" 라벨로 구분 (AdSense 광고로 오인 방지)
════════════════════════════════════════════════════════════-->
<style>
  body:not(.is-homepage) #spj-sidebar-ads.home-only { display: none !important; }

  #spj-sidebar-ads { font-family: "Segoe UI", Arial, sans-serif; margin: 0 0 18px; }

  /* ── AdSense frame ── */
  #spj-sidebar-ads .spj-ad-frame {
    border: 1px solid #d5dfea;
    border-radius: 10px;
    background: #fbfcfe;
    padding: 8px 10px 10px;
    margin-bottom: 22px;
  }
  #spj-sidebar-ads .spj-ad-frame[hidden],
  #spj-sidebar-ads .spj-ad-frame:has(ins.adsbygoogle[data-ad-status="unfilled"]) { display: none; }
  #spj-sidebar-ads .spj-label {
    display: block;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a9bb0;
    margin: 0 0 6px;
  }
  #spj-sidebar-ads ins.adsbygoogle { display: block; min-height: 250px; }

  /* ── Corporate banner ── */
  #spj-sidebar-ads .spj-banner {
    border: 1px solid #d5dfea;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  #spj-sidebar-ads .spj-banner .spj-label { padding: 8px 10px 0; margin: 0 0 6px; }
  #spj-sidebar-ads .spj-banner a { display: block; text-decoration: none; }
  #spj-sidebar-ads .spj-banner img { display: block; width: 100%; height: auto; }
  #spj-sidebar-ads .spj-banner-name {
    display: block;
    padding: 7px 10px 9px;
    font-size: 11px;
    color: #4a6080;
    border-top: 1px solid #eef2f6;
  }

  /* ── Ad space available (no sponsor yet) ── */
  #spj-sidebar-ads .spj-slot {
    display: block;
    margin: 0 10px 10px;
    aspect-ratio: 6 / 5;               /* 300 × 250 */
    border: 2px dashed #9fb3c8;
    border-radius: 8px;
    background: repeating-linear-gradient(135deg, #f6f9fc 0 12px, #eef3f8 12px 24px);
    text-decoration: none;
    color: #4a6080;
    text-align: center;
    position: relative;
  }
  #spj-sidebar-ads .spj-slot-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 14px; gap: 6px;
  }
  #spj-sidebar-ads .spj-slot-size {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #8a9bb0;
    border: 1px solid #c9d6e3; border-radius: 4px; padding: 2px 7px; background: #fff;
  }
  #spj-sidebar-ads .spj-slot-title { font-size: 17px; font-weight: 800; color: #0a2342; line-height: 1.25; }
  #spj-sidebar-ads .spj-slot-text { font-size: 11.5px; line-height: 1.55; color: #4a6080; max-width: 230px; }
  #spj-sidebar-ads .spj-slot-cta {
    margin-top: 6px; display: inline-block; padding: 7px 14px; border-radius: 6px;
    background: #0a2342; color: #7effd8; font-size: 12px; font-weight: 700;
  }
  #spj-sidebar-ads .spj-slot:hover { border-color: #1a9e82; }
  #spj-sidebar-ads .spj-slot:hover .spj-slot-cta { background: #154f7a; }
  #spj-sidebar-ads .spj-slot-alt {
    display: block; margin: -2px 10px 10px; font-size: 10.5px; color: #8a9bb0; text-align: center;
  }
  #spj-sidebar-ads .spj-slot-alt a { display: inline; color: #154f7a; text-decoration: underline; }
</style>

<div id="spj-sidebar-ads" class="home-only">
  <!-- AdSense display unit -->
  <div class="spj-ad-frame" hidden>
    <span class="spj-label">Advertisement</span>
    <ins class="adsbygoogle"
         data-ad-client="ca-pub-1136000774216453"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <!-- Corporate banner -->
  <div class="spj-banner">
    <span class="spj-label">Sponsored</span>
    <div class="spj-banner-body"></div>
  </div>
</div>

<script>
(function () {
  var SPJ_SIDEBAR_ADS = {
    adSlot: "",            // 예: "1234567890"  (AdSense 디스플레이 광고 단위 slot ID)
    sponsors: [
      // { name: "Company Name", image: "https://.../banner-300x250.png",
      //   url: "https://www.company.com/?utm_source=shippauljobs&utm_medium=sidebar",
      //   alt: "Company Name — maritime cyber security solutions" }
    ],
    homeOnly: true,
    advertiseUrl: "https://www.shippauljobs.com/p/advertisement-policy.html",
    contactUrl: "https://www.shippauljobs.com/p/contact-shippauljobs.html"
  };

  var root = document.getElementById("spj-sidebar-ads");
  if (!root) return;
  if (!SPJ_SIDEBAR_ADS.homeOnly) root.classList.remove("home-only");
  else if (!document.body.classList.contains("is-homepage")) return;

  // ── AdSense ──
  var frame = root.querySelector(".spj-ad-frame");
  var ins = frame.querySelector("ins.adsbygoogle");
  if (SPJ_SIDEBAR_ADS.adSlot) {
    ins.setAttribute("data-ad-slot", SPJ_SIDEBAR_ADS.adSlot);
    frame.hidden = false;
    if (!document.querySelector('script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]')) {
      var s = document.createElement("script");
      s.async = true;
      s.crossOrigin = "anonymous";
      s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1136000774216453";
      document.head.appendChild(s);
    }
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) { frame.hidden = true; }
    // :has() 미지원 브라우저용 — 광고가 채워지지 않으면 프레임 숨김
    setTimeout(function () {
      if (ins.getAttribute("data-ad-status") === "unfilled") frame.hidden = true;
    }, 4000);
  }

  // ── Corporate banner ──
  var body = root.querySelector(".spj-banner-body");
  var list = SPJ_SIDEBAR_ADS.sponsors.filter(function (x) { return x && x.image && x.url; });
  // Blogger 가 가젯 저장 시 ×, · 같은 문자를 &#215; 형태로 바꿔 저장하므로, 먼저 원래 문자로 되돌린 뒤 이스케이프
  function decode(t) {
    return String(t || "")
      .replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(+n); })
      .replace(/&#x([0-9a-f]+);/gi, function (_, h) { return String.fromCharCode(parseInt(h, 16)); })
      .replace(/&nbsp;/g, "\u00a0").replace(/&middot;/g, "\u00b7").replace(/&times;/g, "\u00d7").replace(/&amp;/g, "&");
  }
  function esc(t) { return decode(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  if (list.length) {
    var sp = list[Math.floor(Math.random() * list.length)];
    body.innerHTML =
      '<a href="' + esc(sp.url) + '" target="_blank" rel="sponsored noopener">' +
        '<img src="' + esc(sp.image) + '" alt="' + esc(sp.alt || sp.name) + '" loading="lazy" width="300" height="250">' +
        (sp.name ? '<span class="spj-banner-name">' + esc(sp.name) + '</span>' : "") +
      "</a>";
  } else {
    root.querySelector(".spj-banner .spj-label").textContent = "Advertise here";
    body.innerHTML =
      '<a class="spj-slot" href="' + esc(SPJ_SIDEBAR_ADS.advertiseUrl) + '" target="_blank" rel="noopener">' +
        '<span class="spj-slot-inner">' +
          '<span class="spj-slot-size">300 × 250 · SIDEBAR</span>' +
          '<span class="spj-slot-title">Your banner or ad here</span>' +
          '<span class="spj-slot-text">Promote your brand, product, service or job opening to maritime engineers, OT/cyber specialists and industry leaders.</span>' +
          '<span class="spj-slot-cta">See ad options</span>' +
        "</span>" +
      "</a>" +
      '<span class="spj-slot-alt">or <a href="' + esc(SPJ_SIDEBAR_ADS.contactUrl) + '" target="_blank" rel="noopener">contact us</a> for a media kit</span>';
  }
})();
</script>
