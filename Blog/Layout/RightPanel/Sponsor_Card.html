<!--════════════════════════════════════════════════════════════
  Right Panel card : Sponsored banner / "Advertise here" slot
  Where : Blogger 테마 → HTML 편집 → <div id='rp-panel-body'> 바로 아래에 붙여넣기
          (Main.html 에는 이미 반영됨 — 이 파일은 테마 HTML 편집용 원본)
  Note  : 테마 XML 안에 들어가므로 태그는 닫고(<br/>), &는 &amp; 로 씁니다.

  설정 : 아래 script 의 SPJ_RP_SPONSORS 에 배너를 넣으면 배너가 표시되고,
         비워두면 "Advertise here" 광고 자리(판매 중)가 표시됩니다.
════════════════════════════════════════════════════════════-->
        <div class='rp-card' id='rp-card-sponsor'>
          <div class='rp-head'>
            <span class='rp-title' id='rp-sponsor-title'>&#128226; Advertise Here</span>
          </div>
          <div class='rp-body' id='rp-sponsor-body' style='display:block;padding:10px;'>
            <a class='rp-ad-slot' href='https://www.shippauljobs.com/p/advertisement-policy.html' rel='noopener' target='_blank'>
              <span class='rp-ad-size'>250 &#215; 208 &#183; RIGHT PANEL</span>
              <span class='rp-ad-title'>Your banner here</span>
              <span class='rp-ad-text'>Reach maritime engineers, OT/cyber specialists and decision-makers at shipowners, shipyards and makers.</span>
              <span class='rp-ad-cta'>See ad options</span>
            </a>
            <span class='rp-ad-alt'>or <a href='https://www.shippauljobs.com/p/contact-shippauljobs.html' rel='noopener' target='_blank'>contact us</a> for a media kit</span>
          </div>
          <style>
            #rp-card-sponsor .rp-ad-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:6/5;padding:12px;border:2px dashed rgba(126,255,216,0.45);border-radius:8px;background:repeating-linear-gradient(135deg,rgba(26,158,130,0.08) 0 12px,rgba(26,158,130,0.02) 12px 24px);text-align:center;text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;}
            #rp-card-sponsor .rp-ad-slot:hover{border-color:#1affda;}
            #rp-card-sponsor .rp-ad-size{font-size:9.5px;font-weight:700;letter-spacing:0.1em;color:rgba(200,228,248,0.6);border:1px solid rgba(200,228,248,0.25);border-radius:4px;padding:2px 7px;}
            #rp-card-sponsor .rp-ad-title{font-size:16px;font-weight:800;color:#ffffff;}
            #rp-card-sponsor .rp-ad-text{font-size:11px;line-height:1.55;color:rgba(200,228,248,0.75);}
            #rp-card-sponsor .rp-ad-cta{margin-top:4px;padding:6px 13px;border-radius:6px;background:rgba(26,158,130,0.25);border:1px solid #1a9e82;color:#7effd8;font-size:11.5px;font-weight:700;}
            #rp-card-sponsor .rp-ad-alt{display:block;margin-top:7px;font-size:10px;color:rgba(200,228,248,0.5);text-align:center;}
            #rp-card-sponsor .rp-ad-alt a{color:#7effd8;text-decoration:underline;}
            #rp-card-sponsor .rp-ad-banner{display:block;text-decoration:none;}
            #rp-card-sponsor .rp-ad-banner img{display:block;width:100%;height:auto;border-radius:6px;}
            #rp-card-sponsor .rp-ad-name{display:block;margin-top:6px;font-size:10.5px;color:rgba(200,228,248,0.7);text-align:center;}
          </style>
          <script>//<![CDATA[
          (function () {
            var SPJ_RP_SPONSORS = [
              // { name: "Company Name", image: "https://.../banner-300x250.png",
              //   url: "https://www.company.com/?utm_source=shippauljobs&utm_medium=right_panel",
              //   alt: "Company Name — maritime cyber security solutions" }
            ];
            var list = SPJ_RP_SPONSORS.filter(function (x) { return x && x.image && x.url; });
            if (!list.length) return;   /* 배너가 없으면 "Advertise here" 자리를 그대로 둔다 */
            function esc(t) { return String(t || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
            var sp = list[Math.floor(Math.random() * list.length)];
            document.getElementById("rp-sponsor-title").textContent = "📢 Sponsored";
            document.getElementById("rp-sponsor-body").innerHTML =
              '<a class="rp-ad-banner" href="' + esc(sp.url) + '" target="_blank" rel="sponsored noopener">' +
                '<img src="' + esc(sp.image) + '" alt="' + esc(sp.alt || sp.name) + '" loading="lazy" width="300" height="250">' +
                (sp.name ? '<span class="rp-ad-name">' + esc(sp.name) + '</span>' : "") +
              "</a>";
          })();
          //]]></script>
        </div>
        <div class='rp-sep'/>
