<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0518"/>
      <stop offset="45%" style="stop-color:#0f1f3d"/>
      <stop offset="100%" style="stop-color:#0a2342"/>
    </linearGradient>
    <linearGradient id="hullTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#162840"/>
    </linearGradient>
    <linearGradient id="hullBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e30"/>
      <stop offset="100%" style="stop-color:#060e1a"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b6e" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#040c18"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#154f7a" stop-opacity="0"/>
      <stop offset="50%" style="stop-color:#2196f3" stop-opacity="0.35"/>
      <stop offset="100%" style="stop-color:#154f7a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#1a3a6e" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#0a0518" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#centerLight)"/>

  <!-- Stars -->
  <circle cx="50"  cy="30" r="1"   fill="#fff" opacity="0.4"/>
  <circle cx="130" cy="55" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="210" cy="18" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="340" cy="42" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="460" cy="16" r="1"   fill="#fff" opacity="0.4"/>
  <circle cx="590" cy="38" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="700" cy="22" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="800" cy="48" r="0.8" fill="#fff" opacity="0.3"/>
