  <text x="450" y="74" text-anchor="middle" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#softGlow)" font-family="Inter,Segoe UI,Arial,sans-serif">Ship OT Cybersecurity</text>
  <text x="450" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#b8d4ea" letter-spacing="0.8" font-family="Inter,Segoe UI,Arial,sans-serif">Zone · Conduit · ZCD · IACS UR E26/E27</text>
  <line x1="180" y1="120" x2="720" y2="120" stroke="url(#glowBlue)" stroke-width="1.5"/>
